    classification: COMPATIBLE
    previous: Conservar juegos, películas y series que gustan al usuario.
    current: Conservar evidencia positiva, negativa, mixta y pendiente para recomendar.
    action: Ampliación documentada del propósito.
  - area: esquema
    classification: COMPATIBLE
    previous: Valoración, experiencia, opinión y rasgos por obra.
    current: Se conserva el mismo esquema.
    action: Ninguna reinterpretación.
