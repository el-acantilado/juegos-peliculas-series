overall: COMPATIBLE
summary: >
  La biblioteca evoluciona desde archivos planos por medio hacia una partición
  por función recomendadora. Los registros conservan íntegramente su contenido;
  únicamente cambian de ruta y Atlas añade índices navegables de carpeta.
items:
